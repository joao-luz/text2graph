[project]
name = "text2graph"
version = "0.1.0"
description = "A unified pipeline for solving text classification problems via graphs."
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "datasets",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "torch",
    "torch-geometric",
    "transformers",
]

[project.optional-dependencies]
vllm = [
    "ray>=2.57.0",
    "vllm==0.20.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
