# Builds the documentation with Zensical and publishes it to GitHub Pages
# (https://joao-luz.github.io/text2graph/) on every push to main.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/configure-pages@v6

      # The docs are built from the source code without importing it, so only
      # the docs tools are needed, not torch or the other dependencies.
      - name: Install the docs tools
        run: uv sync --locked --only-group docs

      - name: Build the site
        run: uv run --no-sync zensical build --strict --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
